name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        run: ./mvnw -DskipTests package

      - name: Export OpenAPI
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          java -jar target/backend-${VERSION}.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
              break
            fi
            sleep 1
          done
          mkdir -p ../docs/api
          curl -fsS http://127.0.0.1:8080/v3/api-docs.yaml -o ../docs/api/openapi-v${VERSION}.yaml
          pkill -f "backend-${VERSION}.jar" || true
          echo "OPENAPI_FILE=docs/api/openapi-v${VERSION}.yaml" >> "$GITHUB_ENV"

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: ${{ env.OPENAPI_FILE }}

  frontend-e2e-critical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E flows
        env:
          E2E_FIXED_DATE: '2026-03-20'
          E2E_FIXED_TIMESTAMP: '2026-03-20T18:00:00.000Z'
        run: npm run test:e2e:critical

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results

