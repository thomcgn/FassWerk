name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: ./mvnw -B clean verify

      - name: Upload verified backend for full-stack acceptance
        uses: actions/upload-artifact@v4
        with:
          name: verified-backend
          path: backend/target/backend-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Generate coverage report even after test failures
        if: ${{ !cancelled() }}
        run: ./mvnw -B jacoco:report

      - name: Upload backend tests and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare OpenAPI database and credentials
        run: |
          DB_PASSWORD=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 48)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "DB_URL=jdbc:postgresql://127.0.0.1:5432/fasswerk_openapi"
            echo "DB_USER=ci_openapi"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          docker run --detach --name fasswerk-openapi-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=fasswerk_openapi \
            --env POSTGRES_USER=ci_openapi \
            --env POSTGRES_PASSWORD \
            postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

      - name: Export OpenAPI
        env:
          SPRING_PROFILES_ACTIVE: prod
          OPENAPI_SKIP_BUILD: 'true'
          OPENAPI_OUT_FILE: ${{ github.workspace }}/docs/api/openapi.yaml
          MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
        run: ./scripts/export-openapi.sh

      - name: Verify committed OpenAPI contract
        run: git diff --exit-code -- ../docs/api/openapi.yaml

      - name: Set up Node.js for contract generation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend contract generator
        working-directory: frontend
        run: npm ci

      - name: Verify generated frontend API types
        working-directory: frontend
        run: npm run api:check

      - name: Upload backend startup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi-startup-log
          path: backend/target/openapi-backend.log
          if-no-files-found: ignore

      - name: Remove OpenAPI database
        if: always()
        run: docker rm --force fasswerk-openapi-db 2>/dev/null || true

      - name: Upload OpenAPI artifact
        if: ${{ always() && env.OPENAPI_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: ${{ env.OPENAPI_FILE }}
          if-no-files-found: error

      - name: Scan packaged Java dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: backend/target/
          fail-build: true
          grype-version: v0.119.0
          severity-cutoff: high
          output-format: json
          output-file: backend-vulnerabilities.json

      - name: Upload backend vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vulnerabilities
          path: backend-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14

  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all locked npm dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Upload npm vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e-critical:
    needs: [backend-openapi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated API types
        run: npm run api:check

      - name: Run frontend quality gate
        run: |
          npm run test:unit
          npm run test:security
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E flows
        env:
          E2E_PRODUCTION: 'true'
          E2E_FIXED_DATE: '2026-03-20'
          E2E_FIXED_TIMESTAMP: '2026-03-20T18:00:00.000Z'
        run: npm run test:e2e:critical

      - name: Set up Java for real full-stack acceptance
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified backend
        uses: actions/download-artifact@v4
        with:
          name: verified-backend
          path: backend/target

      - name: Verify real services, restart and database restore
        shell: bash
        run: |
          set -o pipefail
          jars=(../backend/target/backend-*.jar)
          export ACCEPTANCE_JAR="$(realpath "${jars[0]}")"
          ../scripts/fullstack-acceptance.sh | tee fullstack-acceptance.log

      - name: Upload full-stack acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-acceptance
          path: frontend/fullstack-acceptance.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  container-images:
    needs: [backend-openapi, frontend-e2e-critical]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASSWERK_IMAGE_TAG: sha-${{ github.sha }}
      FASSWERK_VCS_REF: ${{ github.sha }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4

      - name: Build SHA-tagged images
        run: |
          docker build \
            --build-arg VCS_REF="$FASSWERK_VCS_REF" \
            --build-arg IMAGE_VERSION="$FASSWERK_IMAGE_TAG" \
            --tag "fasswerk/backend:$FASSWERK_IMAGE_TAG" backend
          docker build \
            --build-arg VCS_REF="$FASSWERK_VCS_REF" \
            --build-arg IMAGE_VERSION="$FASSWERK_IMAGE_TAG" \
            --tag "fasswerk/frontend:$FASSWERK_IMAGE_TAG" frontend

      - name: Prepare disposable smoke-test credentials
        run: |
          DB_PASSWORD=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 48)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "DB_USER=ci_container"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "APP_ORIGIN=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Verify hardened runtime
        run: ./scripts/container-smoke.sh

      - name: Scan backend image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: fasswerk/backend:${{ env.FASSWERK_IMAGE_TAG }}
          fail-build: true
          grype-version: v0.119.0
          severity-cutoff: high
          output-format: json
          output-file: backend-image-vulnerabilities.json

      - name: Scan frontend image
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: fasswerk/frontend:${{ env.FASSWERK_IMAGE_TAG }}
          fail-build: true
          grype-version: v0.119.0
          severity-cutoff: high
          output-format: json
          output-file: frontend-image-vulnerabilities.json

      - name: Upload container vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerabilities
          path: '*-image-vulnerabilities.json'
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    if: always()
    needs: [backend-openapi, frontend-dependencies, frontend-e2e-critical, container-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality and security gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
