name: CI

on:
  push:
	branches: ["**"]
  pull_request:

jobs:
  backend-openapi:
	runs-on: ubuntu-latest
	defaults:
	  run:
		working-directory: backend
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Set up JDK
		uses: actions/setup-java@v4
		with:
		  distribution: temurin
		  java-version: "21"
		  cache: maven

	  - name: Compile backend
		run: ./mvnw -q -DskipTests compile

	  - name: Package backend
		run: ./mvnw -q -DskipTests package

	  - name: Export versioned OpenAPI YAML
		run: |
		  VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
		  mkdir -p ../docs/api
		  java -jar target/backend-${VERSION}.jar > /tmp/backend.log 2>&1 &
		  for i in {1..45}; do
			if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
			  break
			fi
			sleep 2
		  done
		  curl -fsS http://127.0.0.1:8080/v3/api-docs.yaml -o ../docs/api/openapi-v${VERSION}.yaml
		  pkill -f "backend-${VERSION}.jar" || true

	  - name: Upload OpenAPI artifact
		uses: actions/upload-artifact@v4
		with:
		  name: openapi-spec
		  path: docs/api/openapi-v*.yaml

  frontend-e2e:
	runs-on: ubuntu-latest
	defaults:
	  run:
		working-directory: frontend
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Set up Node
		uses: actions/setup-node@v4
		with:
		  node-version: "20"
		  cache: npm
		  cache-dependency-path: frontend/package-lock.json

	  - name: Install dependencies
		run: npm ci

	  - name: Install Playwright browsers
		run: npx playwright install --with-deps chromium

	  - name: Lint report for Sonar
		run: |
		  mkdir -p reports
		  npm run lint:report

	  - name: Run E2E
		run: npm run test:e2e

	  - name: Upload Playwright report
		uses: actions/upload-artifact@v4
		if: always()
		with:
		  name: playwright-results
		  path: frontend/test-results/playwright/results.xml

	  - name: Upload ESLint report
		uses: actions/upload-artifact@v4
		if: always()
		with:
		  name: eslint-report
		  path: frontend/reports/eslint-report.json

  sonar:
	runs-on: ubuntu-latest
	needs: [backend-openapi, frontend-e2e]
	if: ${{ secrets.SONAR_TOKEN != '' }}
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Set up JDK
		uses: actions/setup-java@v4
		with:
		  distribution: temurin
		  java-version: "21"

	  - name: Download CI artifacts
		uses: actions/download-artifact@v4

	  - name: Run SonarScanner
		uses: SonarSource/sonarqube-scan-action@v5
		env:
		  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
		  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

