name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify backend
        run: ./mvnw -B clean verify

      - name: Prepare OpenAPI database and credentials
        run: |
          DB_PASSWORD=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 48)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "DB_URL=jdbc:postgresql://127.0.0.1:5432/fasswerk_openapi"
            echo "DB_USER=ci_openapi"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          docker run --detach --name fasswerk-openapi-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=fasswerk_openapi \
            --env POSTGRES_USER=ci_openapi \
            --env POSTGRES_PASSWORD postgres:16-alpine

      - name: Export OpenAPI
        env:
          SPRING_PROFILES_ACTIVE: prod
          OPENAPI_SKIP_BUILD: 'true'
          # Schema export needs PostgreSQL, but does not use an SMTP server.
          MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
        run: ./scripts/export-openapi.sh

      - name: Upload backend startup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi-startup-log
          path: backend/target/openapi-backend.log
          if-no-files-found: ignore

      - name: Remove OpenAPI database
        if: always()
        run: docker rm --force fasswerk-openapi-db 2>/dev/null || true

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: ${{ env.OPENAPI_FILE }}
          if-no-files-found: error

  frontend-e2e-critical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E flows
        env:
          E2E_FIXED_DATE: '2026-03-20'
          E2E_FIXED_TIMESTAMP: '2026-03-20T18:00:00.000Z'
        run: npm run test:e2e:critical

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results

