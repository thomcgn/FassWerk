spring:
  application:
    name: backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: ${FLYWAY_CONNECT_RETRIES:30}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:2s}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  health:
    mail:
      enabled: ${RESERVATION_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

app:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  qr:
    scan-base-url: ${QR_SCAN_BASE_URL:http://localhost:3000}
  auth:
    cleanup:
      enabled: ${AUTH_CLEANUP_ENABLED:true}
      cron: ${AUTH_CLEANUP_CRON:0 */30 * * * *}
      cleanup-expired-refresh-tokens: ${AUTH_CLEANUP_REFRESH_TOKENS:true}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:fasswerk-backend}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  inventory:
    package-defaults:
      BARREL:
        reorder-threshold-packages: 1.00
        minimum-stock-packages: 2.00
        recommended-reorder-packages: 2.00
      CRATE:
        reorder-threshold-packages: 2.00
        minimum-stock-packages: 4.00
        recommended-reorder-packages: 4.00
      BOTTLE:
        reorder-threshold-packages: 12.00
        minimum-stock-packages: 24.00
        recommended-reorder-packages: 12.00
      SINGLE_BOTTLE:
        reorder-threshold-packages: 24.00
        minimum-stock-packages: 48.00
        recommended-reorder-packages: 24.00
      BOX:
        reorder-threshold-packages: 5.00
        minimum-stock-packages: 10.00
        recommended-reorder-packages: 10.00
  sales:
    # Business date handling for night operations
    business-timezone: ${SALES_BUSINESS_TIMEZONE:Europe/Berlin}
    # Example: 05:00 means sales from 00:00-04:59 still belong to previous business day
    business-day-end-time: ${SALES_BUSINESS_DAY_END_TIME:05:00}
    calculation:
      # Number of weeks to look back for average consumption calculation
      weeks-lookback: ${SALES_WEEKS_LOOKBACK:4}
      # Default safety stock multiplier (e.g., 1.5 = 150% of weekly consumption)
      default-safety-factor: ${SALES_DEFAULT_SAFETY_FACTOR:1.5}
      # Default lead time in days for supplier deliveries
      default-lead-time-days: ${SALES_DEFAULT_LEAD_TIME_DAYS:3}
  reservation:
    timezone: ${RESERVATION_TIMEZONE:Europe/Berlin}
    mail:
      enabled: ${RESERVATION_MAIL_ENABLED:false}
      from: ${RESERVATION_MAIL_FROM:no-reply@fasswerk.local}

springdoc:
  api-docs:
    # OpenAPI 3.0 carries nullable explicitly; the TypeScript generator consumes it deterministically.
    version: OPENAPI_3_0
