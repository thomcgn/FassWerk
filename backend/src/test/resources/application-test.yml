spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    connect-retries: 0

app:
  bootstrap:
    admin-email: ""
    admin-password: ""
  qr:
    scan-base-url: http://localhost:8080
  auth:
    cleanup:
      enabled: false
      cron: "0 0 0 * * *"
      cleanup-expired-refresh-tokens: false
  jwt:
    secret: test-secret-for-jwt-signing-that-is-long-enough
    issuer: test-issuer
    access-token-minutes: 60
    refresh-token-days: 7


