services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fasswerk}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in your private environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private environment}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  backend:
    image: "${FASSWERK_BACKEND_REPOSITORY:-fasswerk/backend}:${FASSWERK_IMAGE_TAG:?Set FASSWERK_IMAGE_TAG to a release version or commit SHA}"
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${FASSWERK_VCS_REF:-unknown}
        IMAGE_VERSION: ${FASSWERK_IMAGE_TAG:?Set FASSWERK_IMAGE_TAG to a release version or commit SHA}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fasswerk}
      DB_USER: ${DB_USER:?Set DB_USER in your private environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private environment}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_CONNECT_RETRIES_INTERVAL: 2s
      RESERVATION_TIMEZONE: ${RESERVATION_TIMEZONE:-Europe/Berlin}
      QR_SCAN_BASE_URL: ${QR_SCAN_BASE_URL:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT_SECRET}
      JWT_ISSUER: fasswerk-backend
      JWT_ACCESS_TOKEN_MINUTES: 120
      JWT_REFRESH_TOKEN_DAYS: 14
      AUTH_CLEANUP_ENABLED: true
      AUTH_CLEANUP_CRON: "0 */30 * * * *"
      AUTH_CLEANUP_REFRESH_TOKENS: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8080:8080"

  frontend:
    image: "${FASSWERK_FRONTEND_REPOSITORY:-fasswerk/frontend}:${FASSWERK_IMAGE_TAG:?Set FASSWERK_IMAGE_TAG to a release version or commit SHA}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${FASSWERK_VCS_REF:-unknown}
        IMAGE_VERSION: ${FASSWERK_IMAGE_TAG:?Set FASSWERK_IMAGE_TAG to a release version or commit SHA}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=64m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
