components:
  schemas:
    VolumePriceUpdateRequest:
      required:
      - price
      type: object
      properties:
        price:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
      description: Volume Price Update Request contract
    VolumePriceResponse:
      required:
      - id
      - price
      - volumeMl
      type: object
      properties:
        id:
          type: integer
          format: int64
        volumeMl:
          type: integer
          format: int32
        price:
          type: number
      description: Volume Price Response contract
    TableRequest:
      required:
      - active
      - name
      - status
      type: object
      properties:
        name:
          minLength: 1
          type: string
        area:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - FREE
          - RESERVED
          - OCCUPIED
          - READY_FOR_PAYMENT
        active:
          type: boolean
        seats:
          minimum: 1
          type: integer
          format: int32
          nullable: true
      description: Table Request contract
    TableResponse:
      required:
      - active
      - area
      - id
      - name
      - seats
      - status
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        area:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - FREE
          - RESERVED
          - OCCUPIED
          - READY_FOR_PAYMENT
        active:
          type: boolean
        seats:
          type: integer
          format: int32
          nullable: true
      description: Table Response contract
    ShiftSettlementRequest:
      required:
      - openingCash
      - otherExpenses
      type: object
      properties:
        openingCash:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
        otherExpenses:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
        entries:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ShiftWorkerEntryRequest"
      description: Shift Settlement Request contract
    ShiftWorkerEntryRequest:
      required:
      - employeeName
      - hourlyWage
      - shiftEnd
      - shiftStart
      type: object
      properties:
        employeeName:
          minLength: 1
          type: string
        shiftStart:
          type: string
        shiftEnd:
          type: string
        hourlyWage:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
      description: Shift Worker Entry Request contract
      nullable: true
    ShiftSettlementResponse:
      required:
      - dailyRevenue
      - entries
      - expectedClosingCash
      - id
      - openingCash
      - otherExpenses
      - settlementDate
      - totalWages
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        settlementDate:
          type: string
          format: date
        openingCash:
          type: number
        otherExpenses:
          type: number
        dailyRevenue:
          type: number
        totalWages:
          type: number
        expectedClosingCash:
          type: number
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ShiftWorkerEntryResponse"
      description: Shift Settlement Response contract
    ShiftWorkerEntryResponse:
      required:
      - employeeName
      - hourlyWage
      - id
      - shiftEnd
      - shiftStart
      - wageCost
      - workedHours
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        employeeName:
          type: string
        shiftStart:
          type: string
        shiftEnd:
          type: string
        hourlyWage:
          type: number
        workedHours:
          type: number
        wageCost:
          type: number
      description: Shift Worker Entry Response contract
    CreateReservationRequest:
      required:
      - guestCount
      - guestName
      - reservationDate
      - reservationTime
      type: object
      properties:
        guestName:
          maxLength: 160
          minLength: 0
          type: string
        contactEmail:
          maxLength: 255
          minLength: 0
          type: string
          format: email
          nullable: true
        contactPhone:
          maxLength: 80
          minLength: 0
          type: string
          nullable: true
        reservationDate:
          type: string
          format: date
        reservationTime:
          type: string
        guestCount:
          minimum: 1
          type: integer
          format: int32
      description: Create Reservation Request contract
    ReservationResponse:
      required:
      - assignedTableIds
      - businessDate
      - checkedInAt
      - contactEmail
      - contactPhone
      - durationMinutes
      - endsAt
      - expiresAt
      - guestCount
      - guestName
      - id
      - qrCodeToken
      - qrScanUrl
      - reservationDate
      - reservationTime
      - startsAt
      - status
      - timezone
      type: object
      properties:
        id:
          type: integer
          format: int64
        guestName:
          type: string
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        reservationDate:
          type: string
          format: date
        reservationTime:
          type: string
        guestCount:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - CHECKED_IN
          - REJECTED
          - NO_SHOW
          - EXPIRED
          - CANCELLED
          - COMPLETED
        expiresAt:
          type: string
          format: date-time
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        qrCodeToken:
