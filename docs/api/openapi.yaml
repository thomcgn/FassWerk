openapi: 3.0.1
info:
  title: FassWerk API
  description: "API fuer Reservierung, Tischabrechnung, Lagerverwaltung, Bar-Administration\
    \ und Schichtabrechnung."
  contact:
    name: FassWerk Team
  version: 0.0.1-SNAPSHOT
servers:
- url: /
tags:
- name: Tables
  description: "Tischstammdaten, Kapazitaet und Belegungsstatus"
- name: Table Orders
  description: "Tischbon-Flow inkl. Positionen, Split-Payment und Abschluss"
- name: Inventory
  description: "Lagerverwaltung, Verbrauchstracking, Nachbestellung und Sales-Konfiguration"
- name: Menu
  description: "Bar-Administration fuer Kategorien, Getraenke, Varianten und Volumenpreise"
- name: Shift Settlements
  description: Schicht- und Lohnabrechnungen
- name: Reorder Orders
  description: Nachbestellungen mit Liefertag und Lieferant-Tracking
- name: Reports
  description: Umsatzuebersicht und Nachbestell-PDF
- name: Authentication
  description: "Login, Refresh, Sessionverwaltung und Logout"
- name: Reservations
  description: "Reservierungsanlage, Entscheidungen, Check-in und QR-Flow"
paths:
  /api/volume-prices/{volumeMl}:
    put:
      tags:
      - Menu
      summary: Volumenpreis fuer eine ml-Groesse aktualisieren
      operationId: updateVolumePrice
      parameters:
      - name: volumeMl
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumePriceUpdateRequest"
        required: true
      responses:
        "200":
          description: Volumenpreis aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VolumePriceResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Menu
      summary: Volumenpreis fuer eine ml-Groesse loeschen
      operationId: deleteVolumePrice
      parameters:
      - name: volumeMl
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Volumenpreis geloescht
      security:
      - bearerAuth: []
  /api/tables/{id}:
    put:
      tags:
      - Tables
      summary: Tisch aktualisieren
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
      security:
      - bearerAuth: []
  /api/shift-settlements/{date}:
    get:
      tags:
      - Shift Settlements
      summary: Schichtabrechnung fuer ein Datum abrufen
      operationId: getByDate
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Schichtabrechnung geladen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShiftSettlementResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Shift Settlements
      summary: Schichtabrechnung fuer ein Datum speichern
      operationId: saveByDate
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftSettlementRequest"
        required: true
      responses:
        "200":
          description: Schichtabrechnung gespeichert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShiftSettlementResponse"
      security:
      - bearerAuth: []
  /api/reservations/{id}:
    get:
      tags:
      - Reservations
      summary: Reservierung per ID abrufen
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Reservierung gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          description: Reservierung nicht gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Reservations
      summary: Reservierung mit erneuter Kapazitaetspruefung aendern
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
  /api/reorder/suppliers/{id}:
    put:
      tags:
      - Reorder Orders
      summary: Lieferant aktualisieren
      operationId: updateSupplier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRequest"
        required: true
      responses:
        "200":
          description: Lieferant aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierResponse"
      security:
      - bearerAuth: []
  /api/reorder/orders/{id}/status:
    put:
      tags:
      - Reorder Orders
      summary: Status einer Nachbestellung aendern
      operationId: updateReorderStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Status aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReorderOrderResponse"
      security:
      - bearerAuth: []
  /api/inventory/{id}:
    put:
      tags:
      - Inventory
      summary: Lagerartikel aktualisieren
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemRequest"
        required: true
      responses:
        "200":
          description: Lagerartikel aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "404":
          description: Lagerartikel nicht gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Inventory
      summary: Lagerartikel loeschen
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Lagerartikel geloescht
        "404":
          description: Lagerartikel nicht gefunden
      security:
      - bearerAuth: []
  /api/inventory/{id}/consumption-metadata:
    get:
      tags:
      - Inventory
      summary: Verbrauchsmetadaten fuer Lagerartikel abrufen
      operationId: getConsumptionMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Metadaten geladen oder leer bei fehlender Konfiguration
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsumptionMetadataResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Inventory
      summary: Verbrauchsmetadaten fuer Lagerartikel aktualisieren
      operationId: updateConsumptionMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumptionMetadataRequest"
        required: true
      responses:
        "200":
          description: Verbrauchsmetadaten aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsumptionMetadataResponse"
      security:
      - bearerAuth: []
  /api/inventory/configuration:
    get:
      tags:
      - Inventory
      summary: Globale Sales-/Business-Day-Konfiguration laden
      operationId: getConfiguration
      responses:
        "200":
          description: Konfiguration geladen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SalesConfigurationResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Inventory
      summary: Globale Sales-/Business-Day-Konfiguration speichern
      operationId: updateConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesConfigurationRequest"
        required: true
      responses:
        "200":
          description: Konfiguration gespeichert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SalesConfigurationResponse"
      security:
      - bearerAuth: []
  /api/drinks/{id}:
    put:
      tags:
      - Menu
      summary: Getraenk aktualisieren
      operationId: updateDrink
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkRequest"
        required: true
      responses:
        "200":
          description: Getraenk aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrinkResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Menu
      summary: Getraenk loeschen
      operationId: deleteDrink
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Getraenk geloescht
      security:
      - bearerAuth: []
  /api/drink-variants/{id}:
    put:
      tags:
      - Menu
      summary: Getraenkevariante aktualisieren
      operationId: updateVariant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkVariantRequest"
        required: true
      responses:
        "200":
          description: Variante aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrinkVariantResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Menu
      summary: Getraenkevariante loeschen
      operationId: deleteVariant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Variante geloescht
      security:
      - bearerAuth: []
  /api/drink-categories/{id}:
    put:
      tags:
      - Menu
      summary: Getraenkekategorie aktualisieren
      operationId: updateCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkCategoryRequest"
        required: true
      responses:
        "200":
          description: Kategorie aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrinkCategoryResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Menu
      summary: Getraenkekategorie loeschen
      operationId: deleteCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Kategorie geloescht
      security:
      - bearerAuth: []
  /api/volume-prices:
    get:
      tags:
      - Menu
      summary: Volumenpreise auflisten
      operationId: listVolumePrices
      responses:
        "200":
          description: Volumenpreise geladen
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumePriceResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Menu
      summary: Volumenpreis anlegen oder aktualisieren
      operationId: createVolumePrice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumePriceRequest"
        required: true
      responses:
        "201":
          description: Volumenpreis erstellt oder aktualisiert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VolumePriceResponse"
      security:
      - bearerAuth: []
  /api/tables:
    get:
      tags:
      - Tables
      summary: Tische listen
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Tables
      summary: Tisch anlegen
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
      security:
      - bearerAuth: []
  /api/table-orders/{id}/split-payment:
    post:
      tags:
      - Table Orders
      summary: Teilzahlung fuer ausgewaehlte Positionen durchfuehren
      operationId: splitPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitTableOrderPaymentRequest"
        required: true
      responses:
        "200":
          description: Teilzahlung verarbeitet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SplitTableOrderPaymentResponse"
        "400":
          description: Ungueltige Split-Zuordnung
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SplitTableOrderPaymentResponse"
      security:
      - bearerAuth: []
  /api/table-orders/{id}/reopen-unpaid:
    post:
      tags:
      - Table Orders
      summary: Unbezahlten Bon wieder oeffnen
      operationId: reopenUnpaid
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Bon wieder geoeffnet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
      security:
      - bearerAuth: []
  /api/table-orders/{id}/mark-unpaid:
    post:
      tags:
      - Table Orders
      summary: Bon als unbezahlt markieren
      operationId: markUnpaid
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Bon auf unbezahlt gesetzt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
      security:
      - bearerAuth: []
  /api/table-orders/{id}/items:
    post:
      tags:
      - Table Orders
      summary: Position auf offenen Bon buchen
      operationId: addItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTableOrderItemRequest"
        required: true
      responses:
        "200":
          description: Position gebucht
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
      security:
      - bearerAuth: []
  /api/table-orders/{id}/close:
    post:
      tags:
      - Table Orders
      summary: Bon abschliessen
      operationId: close
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Bon abgeschlossen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
        "409":
          description: Bon kann im aktuellen Zustand nicht abgeschlossen werden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
      security:
      - bearerAuth: []
  /api/table-orders/open:
    post:
      tags:
      - Table Orders
      summary: Neuen offenen Tischbon erstellen
      operationId: open
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenTableOrderRequest"
        required: true
      responses:
        "200":
          description: Bon geoeffnet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
        "409":
          description: Fuer den Tisch existiert bereits ein offener Bon
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableOrderResponse"
      security:
      - bearerAuth: []
  /api/reservations:
    get:
      tags:
      - Reservations
      summary: Reservierungen fuer ein Datum listen
      operationId: list_1
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Reservierungen geladen
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Reservations
      summary: Reservierungsanfrage anlegen
      description: Erstellt eine Reservierung im Status PENDING.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
        required: true
      responses:
        "200":
          description: Reservierung erstellt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          description: Ungueltige Eingabe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
  /api/reservations/{id}/confirm:
    post:
      tags:
      - Reservations
      summary: Reservierungsanfrage bestaetigen
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Reservierung bestaetigt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          description: Reservierung nicht gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
  /api/reservations/{id}/complete:
    post:
      tags:
      - Reservations
      summary: Reservierungsbesuch abschliessen
      description: Beendet den Besuch; normalerweise erfolgt dies durch Bezahlen oder
        Archivieren aller Tischbons.
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
  /api/reservations/{id}/check-in:
    post:
      tags:
      - Reservations
      summary: Reservierung einchecken
      operationId: checkIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Check-in erfolgt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "409":
          description: Statuswechsel nicht erlaubt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
  /api/reservations/{id}/cancel:
    post:
      tags:
      - Reservations
      summary: Reservierungsanfrage ablehnen
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationDecisionRequest"
      responses:
        "200":
          description: Reservierung abgelehnt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          description: Reservierung nicht gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationResponse"
      security:
      - bearerAuth: []
  /api/reservations/scan/{token}:
    post:
      tags:
      - Reservations
      summary: QR-Token scannen und Check-in-Faehigkeit pruefen
      operationId: scan
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Scan erfolgreich
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationScanResponse"
        "404":
          description: Token ungueltig oder abgelaufen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationScanResponse"
  /api/reorder/suppliers:
    get:
      tags:
      - Reorder Orders
      summary: Alle Lieferanten abrufen
      operationId: getAllSuppliers
      parameters:
      - name: onlyActive
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Lieferanten geladen
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Reorder Orders
      summary: Neuen Lieferant erstellen
      operationId: createSupplier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRequest"
        required: true
      responses:
        "200":
          description: Lieferant erstellt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierResponse"
      security:
      - bearerAuth: []
  /api/reorder/orders:
    post:
      tags:
      - Reorder Orders
      summary: Neue Nachbestellung erstellen
      operationId: createReorderOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderOrderRequest"
        required: true
      responses:
        "200":
          description: Nachbestellung erstellt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReorderOrderResponse"
        "404":
          description: Artikel oder Lieferant nicht gefunden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReorderOrderResponse"
      security:
      - bearerAuth: []
  /api/inventory:
    get:
      tags:
      - Inventory
      summary: Lagerartikel auflisten
      operationId: list_2
      responses:
        "200":
          description: Lagerliste geladen
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItemResponse"
      security:
      - bearerAuth: []
    post:
