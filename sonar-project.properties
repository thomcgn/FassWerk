sonar.projectKey=fasswerk
sonar.projectName=FassWerk
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/src/test/java,frontend/e2e

sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/dist/**,**/coverage/**
sonar.test.inclusions=backend/src/test/java/**,frontend/e2e/**/*.spec.ts

sonar.java.binaries=backend/target/classes
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

sonar.eslint.reportPaths=frontend/reports/eslint-report.json

